<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Norvia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; color: #1A2B48; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .bg-beige { background-color: #F2EBE3; }
        
        /* Estilos para el contenido del artículo (Markdown) */
        .article-content p { margin-bottom: 1.5rem; line-height: 1.8; font-size: 1.125rem; color: #374151; }
        .article-content h2 { font-size: 2rem; margin-top: 2.5rem; margin-bottom: 1rem; color: #1A2B48; }
        .article-content h3 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 0.75rem; color: #1A2B48; }
        .article-content blockquote { border-left: 4px solid #1A2B48; padding-left: 1.5rem; font-style: italic; margin: 2rem 0; color: #4B5563; }
        .article-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <nav class="border-b border-gray-100 bg-white">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-serif tracking-tighter text-[#1A2B48]">NORVIA</a>
            <a href="/" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-[#1A2B48] transition">← Volver al inicio</a>
        </div>
    </nav>

    <article class="max-w-3xl mx-auto px-6 py-16">
        <header class="mb-12 text-center">
            <div class="mb-4 flex justify-center items-center gap-2">
                <span class="text-xs font-bold uppercase tracking-[0.2em] text-gray-400">
                    {{ page.categories | join: " & " }}
                </span>
            </div>
            <h1 class="text-4xl md:text-5xl font-serif text-[#1A2B48] leading-tight mb-6">
                {{ page.title }}
            </h1>
            <div class="text-sm text-gray-500 italic">
                Publicado el {{ page.date | date: "%-d de %B, %Y" }}
            </div>
        </header>

        <div class="article-content">
            {{ content }}
        </div>

        <footer class="mt-20 pt-10 border-t border-gray-100">
            <div class="bg-beige p-8 rounded-sm flex flex-col md:flex-row items-center gap-6">
                <div class="w-20 h-20 rounded-full bg-white border border-[#1A2B48] flex items-center justify-center font-serif text-2xl text-[#1A2B48]">
                    {{ page.author | slice: 0 }}
                </div>
                <div class="text-center md:text-left">
                    <p class="text-xs font-bold uppercase tracking-widest text-[#1A2B48] mb-1">Autor</p>
                    <h4 class="text-xl font-serif mb-2">{{ page.author }}</h4>
                    <p class="text-sm text-gray-600 leading-relaxed">
                        {{ page.author_bio }}
                    </p>
                </div>
            </div>
        </footer>
    </article>

    <footer class="bg-white py-12 border-t border-gray-50 text-center">
        <p class="text-[10px] text-gray-400 uppercase tracking-[0.3em]">Norvia Pensamiento Jurídico</p>
    </footer>

</body>
</html>
